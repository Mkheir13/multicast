<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch Party T1 vs KC</title>
<style>
  :root { --bg:#0b0b10; --fg:#e8e8f0; --muted:#8a8aa0; --accent:#c8aa6e; --line:#26263a; --gap:6px; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg); font:14px system-ui, sans-serif; overflow:hidden; }
  #app { height:100%; display:flex; flex-direction:column; gap:var(--gap); padding:var(--gap); }
  #top { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  #top .label { font-weight:600; margin-right:auto; padding:0 4px; }
  #main { flex:1; min-height:0; border:2px solid var(--line); border-radius:6px; overflow:hidden; }
  #row { display:grid; grid-template-columns:repeat(var(--n,6),1fr); gap:var(--gap); }
  .tile { display:flex; flex-direction:column; border:2px solid var(--line); border-radius:6px; overflow:hidden; min-width:0; }
  .vid { aspect-ratio:16/9; }
  .tbar { display:flex; gap:4px; padding:4px; background:#14141f; }
  .tbar .label { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left; padding:3px 7px; font-size:12px; }
  .tbar .edit { padding:3px 7px; font-size:12px; }
  .tile.on, #main.on { border-color:var(--accent); }
  .tile.on .label { color:var(--accent); }
  .tile.on .label::before { content:"🔊 "; }
  button { background:#1a1a28; color:var(--fg); border:1px solid var(--line); border-radius:5px; padding:6px 10px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  #cfg { position:fixed; inset:0; z-index:20; background:#000c; display:grid; place-items:center; }
  #cfg form { background:#14141f; border:1px solid var(--line); border-radius:8px; padding:20px; width:min(420px,92vw); display:grid; gap:10px; }
  #cfg label { display:grid; gap:4px; color:var(--muted); font-size:12px; }
  #cfg input, #cfg textarea { background:#0b0b10; color:var(--fg); border:1px solid var(--line); border-radius:5px; padding:8px; font:inherit; }
  #cfg textarea { min-height:130px; resize:vertical; }
  .hint { color:var(--muted); font-size:12px; margin:0; }
  #pick { position:fixed; inset:0; z-index:20; background:#000c; display:grid; place-items:center; }
  #pick form { background:#14141f; border:1px solid var(--line); border-radius:8px; padding:20px; width:min(380px,92vw); display:grid; gap:10px; }
  #pick input { background:#0b0b10; color:var(--fg); border:1px solid var(--line); border-radius:5px; padding:10px; font:inherit; font-size:16px; }
  #sugg { display:flex; flex-wrap:wrap; gap:6px; max-height:180px; overflow:auto; }
  #sugg button { padding:4px 9px; font-size:12px; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="label" id="main-label"></span>
    <button id="main-edit">Changer le match</button>
    <button id="b-main" title="Son du match (M)">Son match</button>
    <button id="b-mute" title="Tout couper (0)">Tout couper</button>
    <button id="b-cfg" title="Réglages (S)">Réglages</button>
    <button id="b-fs" title="Plein écran (F)">Plein écran</button>
  </div>
  <div id="main"><div id="p-main" style="width:100%;height:100%"></div></div>
  <div id="row"></div>
</div>

<div id="cfg" hidden>
  <form id="cfg-form">
    <strong>Chaînes Twitch</strong>
    <label>Match (en haut)<input id="in-main"></label>
    <label>Casters (une chaîne par ligne, max 8)<textarea id="in-casters"></textarea></label>
    <p class="hint">Clic sur le nom sous une tuile = son de ce caster. Touches : 1-8 caster, M match, 0 muet, S réglages, F plein écran.</p>
    <button type="submit">Appliquer</button>
  </form>
</div>

<div id="pick" hidden>
  <form id="pick-form">
    <strong id="pick-title">Changer de streamer</strong>
    <input id="pick-in" placeholder="Nom de la chaîne Twitch" autocomplete="off" spellcheck="false">
    <div id="sugg"></div>
    <p class="hint">Tape le nom exact de la chaîne (comme dans twitch.tv/<b>nom</b>) puis Entrée.</p>
  </form>
</div>

<script src="https://player.twitch.tv/js/embed/v1.js"></script>
<script>
const DEFAULTS = { main:"lolesports", casters:["caedrel","kamet0","ibai","doublelift","jankos","thebausffs"] };
let cfg = DEFAULTS;
try { cfg = JSON.parse(localStorage.getItem("wp-cfg")) || DEFAULTS; } catch {}

const players = {};   // key -> Twitch.Player
let active = null;    // key with sound

function makePlayer(divId, channel) {
  const p = new Twitch.Player(divId, {
    channel, width:"100%", height:"100%", muted:true, autoplay:true,
    parent:[location.hostname || "localhost"]
  });
  p.addEventListener(Twitch.Player.READY, () => { p.setMuted(true); });
  return p;
}

function setAudio(key) {
  active = key;
  for (const [k, p] of Object.entries(players)) {
    const on = k === key;
    try { p.setMuted(!on); if (on) p.setVolume(1); } catch {}
    const el = k === "main" ? document.getElementById("main") : document.getElementById("t-" + k);
    el && el.classList.toggle("on", on);
  }
}

function build() {
  document.getElementById("p-main").innerHTML = "";
  document.getElementById("main-label").textContent = cfg.main;
  const row = document.getElementById("row");
  row.innerHTML = "";
  row.style.setProperty("--n", cfg.casters.length || 1);
  for (const k in players) delete players[k];

  players.main = makePlayer("p-main", cfg.main);
  cfg.casters.forEach((ch, i) => {
    const t = document.createElement("div");
    t.className = "tile"; t.id = "t-" + i;
    t.innerHTML = `<div class="vid"><div id="p-${i}" style="width:100%;height:100%"></div></div><div class="tbar"><button class="label" title="Activer le son">${i+1}. ${ch}</button><button class="edit">Changer</button></div>`;
    t.querySelector(".label").onclick = () => setAudio(active === String(i) ? null : String(i));
    t.querySelector(".edit").onclick = () => openPick(String(i));
    row.appendChild(t);
    players[i] = makePlayer("p-" + i, ch);
  });
  active = null;
}

// Twitch search needs an API key, so suggestions are a fixed list of LoL co-streamers.
const KNOWN = ["caedrel","kamet0","ibai","doublelift","jankos","thebausffs","ls","nemesis","agurin","rekkles",
  "sheepyverse","zacknani","chap_gg","tarzaned","imls","spica","yamatocannon","drututt","otplol_","lolesports",
  "lck","lec","riotgames","tyler1","sneakylol","thebausffs","broxah","trick2g","pobelter","baiano"];
let pickKey = null;

function openPick(key) {
  pickKey = key;
  const cur = key === "main" ? cfg.main : cfg.casters[+key];
  document.getElementById("pick-title").textContent = key === "main" ? "Changer le match (en haut)" : `Changer la tuile ${+key+1} (${cur})`;
  const inp = document.getElementById("pick-in");
  inp.value = ""; renderSugg("");
  document.getElementById("pick").hidden = false;
  inp.focus();
}
function renderSugg(q) {
  q = q.trim().toLowerCase();
  const list = [...new Set(KNOWN)].filter(n => n.includes(q));
  const box = document.getElementById("sugg");
  box.innerHTML = "";
  for (const n of list) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = n;
    b.onclick = () => applyPick(n);
    box.appendChild(b);
  }
}
function applyPick(name) {
  name = name.trim().toLowerCase().replace(/^.*twitch\.tv\//, "").replace(/[^a-z0-9_]/g, "");
  if (!name || pickKey === null) return;
  const div = pickKey === "main" ? "p-main" : "p-" + pickKey;
  if (pickKey === "main") { cfg.main = name; document.getElementById("main-label").textContent = name; }
  else {
    cfg.casters[+pickKey] = name;
    document.querySelector(`#t-${pickKey} .label`).textContent = `${+pickKey+1}. ${name}`;
  }
  try { localStorage.setItem("wp-cfg", JSON.stringify(cfg)); } catch {}
  document.getElementById(div).innerHTML = "";
  players[pickKey] = makePlayer(div, name);
  if (active === pickKey) setAudio(null);
  document.getElementById("pick").hidden = true;
}
document.getElementById("pick-in").oninput = e => renderSugg(e.target.value);
document.getElementById("pick-form").onsubmit = e => { e.preventDefault(); applyPick(document.getElementById("pick-in").value); };
document.getElementById("pick").onclick = e => { if (e.target.id === "pick") e.currentTarget.hidden = true; };

function openCfg() {
  document.getElementById("in-main").value = cfg.main;
  document.getElementById("in-casters").value = cfg.casters.join("\n");
  document.getElementById("cfg").hidden = false;
}
document.getElementById("cfg-form").onsubmit = e => {
  e.preventDefault();
  const casters = document.getElementById("in-casters").value.split(/\s+/).map(s => s.trim().toLowerCase()).filter(Boolean).slice(0, 8);
  cfg = { main: document.getElementById("in-main").value.trim().toLowerCase() || DEFAULTS.main, casters };
  try { localStorage.setItem("wp-cfg", JSON.stringify(cfg)); } catch {}
  document.getElementById("cfg").hidden = true;
  build();
};
document.getElementById("cfg").onclick = e => { if (e.target.id === "cfg") e.currentTarget.hidden = true; };

const fs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{});
document.getElementById("b-main").onclick = () => setAudio(active === "main" ? null : "main");
document.getElementById("b-mute").onclick = () => setAudio(null);
document.getElementById("b-cfg").onclick = openCfg;
document.getElementById("main-edit").onclick = () => openPick("main");
document.getElementById("b-fs").onclick = fs;

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { document.getElementById("pick").hidden = true; document.getElementById("cfg").hidden = true; return; }
  if (!document.getElementById("cfg").hidden || !document.getElementById("pick").hidden || e.target.matches("input,textarea")) return;
  const k = e.key.toLowerCase();
  if (k >= "1" && k <= "8" && players[+k - 1]) setAudio(String(+k - 1));
  else if (k === "m") setAudio("main");
  else if (k === "0") setAudio(null);
  else if (k === "s") openCfg();
  else if (k === "f") fs();
});

build();
</script>
</body>
</html>
